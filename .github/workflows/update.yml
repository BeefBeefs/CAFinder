name: Update settlements

on:
  schedule:
    - cron: "17 14 * * *"   # daily, 14:17 UTC
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild settlements.json
        run: python3 scripts/scrape.py
      - name: Commit if changed
        run: |
          git config user.name "settlements-bot"
          git config user.email "settlements-bot@users.noreply.github.com"
          git add settlements.json
          git diff --cached --quiet || git commit -m "Update settlements"
          git push
